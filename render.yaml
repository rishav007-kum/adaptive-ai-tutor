services:
  - type: web
    name: learnwell-tutor
    runtime: docker
    rootDir: desktop-app
    dockerfilePath: desktop-app/Dockerfile
    dockerContext: desktop-app
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: learnwell-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false

databases:
  - name: learnwell-db
    databaseName: learnwell
    user: learnwell
    plan: basic-256mb
    region: singapore
    diskSizeGB: 1
